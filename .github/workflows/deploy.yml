name: Deploy Fawtara to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Permissions required for the GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public (publishable) Supabase values — safe to expose; RLS protects data.
      NEXT_PUBLIC_SUPABASE_URL: https://xlfoesqvxevsnkebmnas.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_y1v_9QURdz80QVInMddwBg_ePLCchqh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
